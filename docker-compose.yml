# PostgreSQL for the news portal.
#   docker compose up -d
#   then put this line in a .env file at the project root:
#   DATABASE_URL=postgresql+psycopg://news:news@localhost:5432/news_portal
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
